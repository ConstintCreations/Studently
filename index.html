<!DOCTYPE html>
<html lang="en">
<head>
    <script src="script.js" defer></script>
    <script src="Scripts/adjustdisplay.js" defer></script>
    <script src="Scripts/dropdowns.js" defer></script>
    <script src="Scripts/modules.js" defer></script>
    <script src="Scripts/stations.js" defer></script>
    <script src="Scripts/settings.js" defer></script>
    <script src="Scripts/pickr.js" defer></script>
    <title>Studently</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Favicons/favicon-16x16.png">
    <link rel="manifest" href="/Favicons/site.webmanifest">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400" rel="stylesheet">
    <script src="https://kit.fontawesome.com/da7fda860c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Styles/modules.css">
</head>
<body>
    <div class="settings-modal">
        <div class="modal-background">
            <div class="modal-content">
                <i class="fa-solid fa-xmark settings-close-modal close-modal"></i>
                <div class="modal-title">
                    <i class="fa-solid fa-gear"></i> Settings
                </div>
                <div class="modal-body">

                    <div class="setting-section">
                        <p class="setting-title"><i class="fa-solid fa-palette setting-icon"></i>Theme</p>
                        <div class="setting-item">
                            <p class="setting-key primary-color-setting">
                                Primary Color:
                            </p>
                            <div class="color-picker-primary"></div>
                        </div>
                        <div class="setting-item">
                            <p class="setting-key secondary-color-setting">
                                Secondary Color:
                            </p>
                            <div class="color-picker-secondary"></div>
                        </div>
                        <div class="setting-item">
                            <p class="setting-key text-color-setting">
                                Text Color:
                            </p>
                            <div class="color-picker-text"></div>
                        </div>
                        <div class="setting-item">
                            <p class="setting-key shadow-color-setting">
                                Shadow Color:
                            </p>
                            <div class="color-picker-shadow"></div>
                        </div>
                        <button class="reset-button reset-theme-button"></button>
                    </div>
                    
                    <div class="setting-section">
                        <p class="setting-title"><i class="fa-solid fa-bell setting-icon"></i>Schedules</p>
                        <div class="bell-schedule-body">
                                
                        </div>
                        <div class="bell-schedule-bottom-buttons bottom-buttons">
                            <button class="add-bell-schedule-button plus-button">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <button class="reset-button reset-bell-schedules-button"></button>
                        </div>
                    </div>
                    <div class="setting-section">
                        <p class="setting-title"><i class="fa-solid fa-calendar"></i>Events</p>
                        <div class="events-bottom-buttons bottom-buttons">
                            <button class="edit-events-button fancy-button">Edit Events</button>
                            <button class="reset-button reset-events-button"></button>
                        </div>
                    </div>
                    <!-- Setting Section Template

                    <div class="setting-section">
                        <p class="setting-title"><i class="fa-solid fa-palette setting-icon"></i>Template</p>
                        <div class="setting-item">
                            <p class="setting-key">
                                Setting Key:
                            </p>
                            <div class="setting-value">Test</div>
                        </div>
                        <button class="reset-button"></button>
                    </div>

                    -->

                </div>
            </div>
        </div>
    </div>
    <div class="create-bell-schedule-modal">
        <div class="modal-background">
            <div class="add-bell-schedule-modal-content add-item-modal-content">
                <i class="fa-solid fa-xmark close-modal create-bell-schedule-close-modal"></i>
                <div class="modal-title add-bell-schedule-title">
                    <i class="fa-solid fa-bell setting-icon"></i> Add Schedule
                </div>
                <div class="add-bell-schedule-body add-item-body">

                    <div class="add-bell-schedule-item">
                        <p class="add-item-key">
                            Name:
                        </p>
                        <input name="add-schedule-name" type="text" class="add-bell-schedule-name add-item-name" value="New Schedule" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
                    </div>
                    <div class="add-bell-schedule-item">
                        <p class="add-item-key add-item-key-centered">
                            Schedule:
                        </p>
                    </div>

                    <div class="add-bell-schedule-periods">
                        
                            <button class="add-period-button">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>

                    <div class="add-bell-schedule-button-group add-item-button-group">
                        <button class="add-bell-schedule-save-button fancy-button">Save Schedule</button>
                        <button class="add-bell-schedule-cancel-button fancy-button">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="edit-events-modal">
        <div class="modal-background">
            <div class="edit-events-modal-content add-item-modal-content">
                <i class="fa-solid fa-xmark close-modal edit-events-close-modal"></i>
                <div class="modal-title edit-events-title">
                    <i class="fa-solid fa-calendar setting-icon"></i> Edit Events
                </div>
                <div class="edit-events-body add-item-body">
                    <div class="events">
                            <button class="add-event-button">
                                <i class="fa-solid fa-plus"></i>
                            </button>

                        </div>

                    <div class="edit-events-button-group add-item-button-group">
                        <button class="edit-events-save-button fancy-button">Save Events</button>
                        <button class="edit-events-cancel-button fancy-button">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="stations-modal">
        <div class="modal-background">
            <div class="modal-content">
                <i class="fa-solid fa-xmark stations-close-modal close-modal"></i>
                <div class="modal-title">
                    <ion-icon name="albums" class="stations-icon"></ion-icon> Stations
                </div>
                <div class="modal-body stations-body">

                    <div class="station-bottom-buttons bottom-buttons">
                        <button class="new-station-button plus-button">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button class="reset-stations-button reset-button"></button>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <div class="add-station-modal">
        <div class="modal-background">
            <div class="add-station-modal-content add-item-modal-content">
                <i class="fa-solid fa-xmark close-modal add-station-close-modal"></i>
                <div class="modal-title add-station-title">
                    <ion-icon name="albums" class="stations-icon"></ion-icon> Add Station
                </div>
                <div class="add-station-body add-item-body">

                    <div class="add-station-item">
                        <p class="add-station-key">
                            Name:
                        </p>
                        <input name="add-station-name" type="text" class="add-station-name add-item-name" value="New Station" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
                    </div>

                    <div class="add-station-item">
                        <p class="add-station-key">
                            Main Module:
                        </p>

                        <div class="custom-dropdown add-station-main-module-dropdown">
                            <div class="dropdown-selected main-module-selected" data-value="bell-timer" style="z-index: 35;">Bell Timer</div>
                            <div class="dropdown-options" style="z-index: 30;">
                                <div class="dropdown-option" data-value="bell-schedule">Bell Schedule</div>
                                <div class="dropdown-option selected" data-value="bell-timer">Bell Timer</div>
                                <div class="dropdown-option" data-value="to-do-list">To Do List</div>
                                <div class="dropdown-option" data-value="upcoming-events">Upcoming Events</div>
                                <div class="dropdown-option" data-value="weather">Weather</div>
                            </div>
                        </div>

                    </div>
                    <div class="add-station-item">
                        <p class="add-station-key">
                            Secondary Modules:
                        </p>

                        <div class="custom-dropdown add-station-secondary-modules-dropdown">
                            <div class="dropdown-selected" style="z-index: 25;">Select Modules</div>
                            <div class="dropdown-options add-station-secondary-modules-dropdown-options" style="z-index: 20;">
                                <input type="checkbox" id="bell-schedule" value="bell-schedule">
                                <label for="bell-schedule">Bell Schedule</label>

                                <input type="checkbox" id="bell-timer" value="bell-timer">
                                <label for="bell-timer">Bell Timer</label>

                                <input type="checkbox" id="to-do-list" value="to-do-list">
                                <label for="to-do-list">To-Do List</label>

                                <input type="checkbox" id="upcoming-events" value="upcoming-events">
                                <label for="upcoming-events">Upcoming Events</label>

                                <input type="checkbox" id="weather" value="weather">
                                <label for="weather">Weather</label>
                            </div>
                        </div>

                    </div>
                    <div class="add-station-button-group add-item-button-group">
                        <button class="add-station-add-button fancy-button">Add Station</button>
                        <button class="add-station-edit-button fancy-button">Edit Station</button>
                        <button class="add-station-cancel-button fancy-button">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="settings">
        <i class="fa-solid fa-gear"></i>
    </div>
    <div class="stations">
        <ion-icon name="albums" class="stations-icon"></ion-icon>
    </div>

    <div class="main">
        
    </div>
    <div class="secondary">
    </div>
</body>
</html>
